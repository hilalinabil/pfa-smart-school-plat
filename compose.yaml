# Whole platform for local development (README §10, §14).
#   cp .env.example .env && docker compose up -d --build
#
# Startup order (depends_on + healthchecks):
#   postgres, kafka (+ kafka-init) -> config-server -> discovery-server
#   -> api-gateway, sample-service -> nginx
#
# Host ports: only Nginx (80) is part of the platform contract. The others are
# published on 127.0.0.1 for development only and must not be exposed elsewhere.

name: university-platform

x-spring-service: &spring-service
  restart: unless-stopped
  networks: [platform-net]
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/actuator/health/readiness || exit 1"]
    interval: 15s
    timeout: 3s
    start_period: 90s
    retries: 5

x-spring-client-env: &spring-client-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
  EUREKA_URL: ${EUREKA_URL}

services:

  # ---------------------------------------------------------------- infrastructure

  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    networks: [platform-net]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      DOCUMENT_DB_NAME: ${DOCUMENT_DB_NAME}
      DOCUMENT_DB_USER: ${DOCUMENT_DB_USER}
      DOCUMENT_DB_PASSWORD: ${DOCUMENT_DB_PASSWORD}
      REQUEST_DB_NAME: ${REQUEST_DB_NAME}
      REQUEST_DB_USER: ${REQUEST_DB_USER}
      REQUEST_DB_PASSWORD: ${REQUEST_DB_PASSWORD}
      ASSISTANT_DB_NAME: ${ASSISTANT_DB_NAME}
      ASSISTANT_DB_USER: ${ASSISTANT_DB_USER}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      AUDIT_DB_NAME: ${AUDIT_DB_NAME}
      AUDIT_DB_USER: ${AUDIT_DB_USER}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      REPORTING_DB_NAME: ${REPORTING_DB_NAME}
      REPORTING_DB_USER: ${REPORTING_DB_USER}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD}
      AI_DB_NAME: ${AI_DB_NAME}
      AI_DB_USER: ${AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    # ports: ["127.0.0.1:5432:5432"]   # optional, for local debugging with a SQL client
    healthcheck:
      # -h 127.0.0.1: the temporary init server listens on the socket only, so this
      # stays unhealthy until the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    networks: [platform-net]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    # ports: ["127.0.0.1:9092:9092"]   # optional; host clients would also need an extra advertised listener
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  kafka-init:
    image: apache/kafka:4.3.2
    restart: "no"
    networks: [platform-net]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR}
    volumes:
      - ./infrastructure/kafka:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]

  # ---------------------------------------------------------------- platform

  config-server:
    <<: *spring-service
    build: ./platform/config-server
    image: university-platform/config-server:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: native
      SERVER_PORT: 8888
      CONFIG_REPO_LOCATION: file:/config-repo/
    volumes:
      - ./infrastructure/config-repo:/config-repo:ro
    ports:
      - "127.0.0.1:8888:8888"   # development only
    deploy:
      resources:
        limits:
          memory: 384m

  discovery-server:
    <<: *spring-service
    build: ./platform/discovery-server
    image: university-platform/discovery-server:local
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "127.0.0.1:8761:8761"   # development only (Eureka dashboard)
    deploy:
      resources:
        limits:
          memory: 384m

  api-gateway:
    <<: *spring-service
    build: ./platform/api-gateway
    image: university-platform/api-gateway:local
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      <<: *spring-client-env
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"   # development only; clients go through Nginx
    deploy:
      resources:
        limits:
          memory: 512m

  # THROWAWAY: delete with services/sample-service when identity-service exists (Phase 3).
  sample-service:
    <<: *spring-service
    build: ./services/sample-service
    image: university-platform/sample-service:local
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      <<: *spring-client-env
      SERVER_PORT: 8090
    # No container_name and no host port: two replicas, reached only through the gateway.
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 384m

  # ---------------------------------------------------------------- edge

  nginx:
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    networks: [platform-net]
    depends_on:
      api-gateway:
        condition: service_healthy
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/html:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m

  # ---------------------------------------------------------------- observability

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    networks: [platform-net]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # development only
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:12.4.15
    restart: unless-stopped
    networks: [platform-net]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # development only
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  platform-net:
    name: platform-net

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  # File storage for DocumentStorage / LocalFileStorage (README §5 "File storage").
  # Mounted by document-service (Phase 4, read-only by the Ingestion Worker in Phase 5)
  # and request-service (Phase 8) at ${DOCUMENT_STORAGE_PATH} / ${REQUEST_ATTACHMENTS_STORAGE_PATH}.
  document-storage:
  request-attachments-storage:
