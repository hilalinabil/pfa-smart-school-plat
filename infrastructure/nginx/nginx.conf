# Edge proxy: the only public entry point (README §5).
# - serves the frontend at /           (placeholder page until the Angular app exists)
# - forwards /api/ to the API Gateway  (which routes by service ID through Eureka)
# - generates X-Request-Id, applies upload and rate limits

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # Reuse the client's X-Request-Id, otherwise use nginx's own unique $request_id.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time request_id=$req_id';
    access_log /dev/stdout main;

    # Basic rate limit per client IP on the API.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    # Upload limit for documents and attachments.
    client_max_body_size 25m;

    # Docker's internal DNS. Resolving at request time (not only at startup) lets
    # nginx follow the gateway when its container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        location /api/ {
            limit_req zone=api burst=40 nodelay;

            set $api_gateway http://api-gateway:8080;
            proxy_pass $api_gateway;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Request-Id      $req_id;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header Connection        "";

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # Placeholder page; replaced by the Angular build later (SPA fallback ready).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Container healthcheck only.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }

    # --- Production TLS (disabled). Certificates are never stored in this repository:
    # mount them at runtime (e.g. from a secret store) and enable this block.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name university.example.org;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #
    #     # ... same locations as the port 80 server above ...
    # }
    #
    # server {
    #     listen 80;
    #     server_name university.example.org;
    #     return 301 https://$host$request_uri;
    # }
}
