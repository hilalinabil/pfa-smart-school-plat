# Scrapes /actuator/prometheus of every Spring service.
# Singletons are reached by their Compose service name. Replicated services are
# discovered through Docker DNS (one A record per replica), never by container name.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-server:8888"]

  - job_name: discovery-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["discovery-server:8761"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["api-gateway"]
        type: A
        port: 8080
        refresh_interval: 15s

  # THROWAWAY: remove with sample-service in Phase 3.
  - job_name: sample-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["sample-service"]
        type: A
        port: 8090
        refresh_interval: 15s
