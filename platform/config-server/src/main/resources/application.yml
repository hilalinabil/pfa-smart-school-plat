# The Config Server loads its own settings locally: it is the first Spring
# service to start and depends on nothing else (not even Eureka).
spring:
  application:
    name: config-server
  profiles:
    # "native" = read files from a folder instead of a Git repository.
    active: native
  cloud:
    config:
      server:
        native:
          # Docker: infrastructure/config-repo is mounted read-only at /config-repo.
          # Local run: CONFIG_REPO_LOCATION=file:../../infrastructure/config-repo/
          search-locations: ${CONFIG_REPO_LOCATION:file:/config-repo/}

server:
  port: ${SERVER_PORT:8888}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
